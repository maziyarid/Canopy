    height: 630px;

    justify-content: center;
    text-align: center;
    z-index: 2;
    padding: 0 180px;

    font-size: 15px;

    text-transform: uppercase;
    color: #c5d4b0;
    margin: 0 0 18px;
  }

    font-weight: 600;
    font-size: 168px;
    line-height: 0.86;
    letter-spacing: -0.03em;

    margin: 0;

    font-variation-settings: "opsz" 144, "SOFT" 20, "WONK" 0;
    text-shadow: 0 2px 0 #1c191433, 0 18px 40px #12140faa;
  }
  .rule {
    width: 88px;
    height: 2px;
    background: #c5d4b0;
    margin: 22px 0 16px;
    opacity: 0.9;
  }
  .tag {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    text-transform: uppercase;
    color: #c5d4b0;
    margin: 0;
  }
</style>
